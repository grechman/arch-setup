# Font
font_family      JetBrainsMono Nerd Font
font_size        16.0
# Text weight (text_composition_strategy) is managed per-theme by ~/.local/bin/theme-apply
# via themes/current.conf: light themes thicken dark-on-light glyphs, dark themes stay default.

# Shell
shell            /usr/bin/zsh
shell_integration enabled no-title

# Background (per-theme opacity managed by ~/.local/bin/theme-apply via themes/current.conf)
background_opacity 0.91
dynamic_background_opacity yes

# Copy/paste (latin + russian layout)
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+с copy_to_clipboard
map ctrl+shift+м paste_from_clipboard

# Tabs (latin + russian layout)
# closing is always safe: zmx tabs just detach, sessions keep running
confirm_os_window_close 0

# Tab bar: flat tmux-style entries (colors are per-theme in themes/current.conf)
# ✳ = unseen output in a background tab (claude still streaming = working);
# red ! = bell (claude rings it when a task finishes / needs input).
# Both only show on unfocused tabs and clear when you look at the tab.
tab_bar_style separator
tab_separator ""
tab_title_template        " ○ {index} {activity_symbol}{fmt.fg.red}{bell_symbol}{fmt.fg.tab}{title} "
active_tab_title_template " ● {index} {title} "
tab_activity_symbol "✳ "
bell_on_tab "! "
active_tab_font_style   bold
inactive_tab_font_style normal
map alt+n launch --type=tab --cwd=current /home/grechman/.local/bin/zmx-tab
map alt+o remote_control_script /home/grechman/.local/bin/zmx-open
map alt+r launch --type=overlay --allow-remote-control /home/grechman/.local/bin/zmx-rename
map alt+w close_tab
map alt+т launch --type=tab --cwd=current /home/grechman/.local/bin/zmx-tab
map alt+щ remote_control_script /home/grechman/.local/bin/zmx-open
map alt+к launch --type=overlay --allow-remote-control /home/grechman/.local/bin/zmx-rename
map alt+ц close_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

# Theme (managed by ~/.local/bin/theme-apply)
include themes/current.conf
