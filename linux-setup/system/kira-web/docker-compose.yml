services:
  searxng:
    image: searxng/searxng:latest
    container_name: kira-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  kira-fetch:
    build: ./fetch
    image: kira-fetch:1
    container_name: kira-fetch
    restart: unless-stopped
    ports:
      - "127.0.0.1:8899:8000"
    # headless chromium wants more than the default 64MB of shared memory
    shm_size: "1gb"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
